server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/malina-matrix/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /data.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
